app-id: io.github.archerycrate.ArcheryCrate
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: archerycrate
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Run asusctl, cardwire and pkexec on the host (flatpak-spawn --host).
  - --talk-name=org.freedesktop.Flatpak
  # Tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
  # "Start when I log in" writes ~/.config/autostart/archerycrate.desktop.
  - --filesystem=xdg-config/autostart:create
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/archerycrate/cargo
modules:
  - name: archerycrate
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/archerycrate /app/bin/archerycrate
      - install -Dm644 packaging/io.github.archerycrate.ArcheryCrate.desktop /app/share/applications/io.github.archerycrate.ArcheryCrate.desktop
      - install -Dm644 packaging/io.github.archerycrate.ArcheryCrate.svg /app/share/icons/hicolor/scalable/apps/io.github.archerycrate.ArcheryCrate.svg
      - install -Dm644 packaging/io.github.archerycrate.ArcheryCrate.metainfo.xml /app/share/metainfo/io.github.archerycrate.ArcheryCrate.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - shots
          - packaging/out
          - packaging/tools
          - packaging/flatpak/build-dir
          - packaging/flatpak/repo
          - packaging/flatpak/.flatpak-builder
      # Generated by build-flatpak.sh with flatpak-cargo-generator (vendored crates for an offline build).
      - cargo-sources.json
